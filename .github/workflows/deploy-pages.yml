name: Deploy stable and development Pages

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages are published on push to main/develop (and manual dispatch).
    # Skip on release: refs/tags/* can never satisfy the github-pages
    # environment branch policy, so the job only ever fails there.
    if: >-
      github.event_name != 'release' &&
      (github.event_name != 'push' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: stable

      - name: Check out development branch
        uses: actions/checkout@v7
        with:
          ref: develop
          path: development

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            development/package-lock.json

      - name: Resolve channel commits
        shell: bash
        run: |
          echo "STABLE_COMMIT_SHA=$(git -C stable rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_COMMIT_SHA=$(git -C development rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install stable dependencies
        working-directory: stable
        run: npm ci

      - name: Test and build stable channel
        working-directory: stable
        env:
          BUILD_CHANNEL: stable
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          BUNGIE_OAUTH_CLIENT_ID: ${{ secrets.BUNGIE_OAUTH_CLIENT_ID }}
          BUNGIE_OAUTH_CLIENT_SECRET: ${{ secrets.BUNGIE_OAUTH_CLIENT_SECRET }}
        run: BUILD_COMMIT_SHA="$STABLE_COMMIT_SHA" npm run check

      - name: Install development dependencies
        working-directory: development
        run: npm ci

      - name: Test and build development channel
        working-directory: development
        env:
          BUILD_CHANNEL: develop
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          BUNGIE_OAUTH_CLIENT_ID: ${{ secrets.BUNGIE_OAUTH_CLIENT_ID }}
          BUNGIE_OAUTH_CLIENT_SECRET: ${{ secrets.BUNGIE_OAUTH_CLIENT_SECRET }}
        run: BUILD_COMMIT_SHA="$DEVELOPMENT_COMMIT_SHA" npm run check

      - name: Compose Pages channels
        run: node development/scripts/compose-pages.mjs stable/dist development/dist pages

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s pages/index.html
          test -s pages/app/index.html
          test -s pages/dev/app/index.html
          test -s pages/destiny2-armor-solver.html
          test -s pages/versions.json
          test -d pages/assets
          test -d pages/dev/assets
          grep -q 'data-development-entry' pages/index.html
          ! grep -q 'data-development-entry' pages/dev/index.html
          ! grep -q './src/portal.mjs' pages/index.html
          ! grep -q '../src/app.mjs' pages/app/index.html
          ! grep -q '../src/app.mjs' pages/dev/app/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  offline-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline distribution
        run: npm run build:offline

      - name: Package offline distribution
        shell: bash
        run: |
          cd dist-offline
          zip -r ../d2-armor-solver-offline.zip .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: d2-armor-solver-offline
          path: d2-armor-solver-offline.zip
          if-no-files-found: error
          retention-days: 14

  offline-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline distribution
        run: npm run build:offline

      - name: Package offline distribution
        shell: bash
        run: |
          cd dist-offline
          zip -r "../d2-armor-solver-offline-${{ github.event.release.tag_name }}.zip" .

      - name: Attach offline distribution to release
        uses: softprops/action-gh-release@v2
        with:
          files: d2-armor-solver-offline-${{ github.event.release.tag_name }}.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
