name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          BUNGIE_OAUTH_CLIENT_ID: ${{ secrets.BUNGIE_OAUTH_CLIENT_ID }}
          BUNGIE_OAUTH_CLIENT_SECRET: ${{ secrets.BUNGIE_OAUTH_CLIENT_SECRET }}
        run: npm run check

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/app/index.html
          test -s dist/destiny2-armor-solver.html
          test -d dist/assets
          ! grep -q './src/portal.mjs' dist/index.html
          ! grep -q '../src/app.mjs' dist/app/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  offline-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline distribution
        run: npm run build:offline

      - name: Package offline distribution
        shell: bash
        run: |
          cd dist-offline
          zip -r ../d2-armor-solver-offline.zip .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: d2-armor-solver-offline
          path: d2-armor-solver-offline.zip
          if-no-files-found: error
          retention-days: 14

  offline-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline distribution
        run: npm run build:offline

      - name: Package offline distribution
        shell: bash
        run: |
          cd dist-offline
          zip -r ../d2-armor-solver-offline.zip .

      - name: Attach offline distribution to release
        uses: softprops/action-gh-release@v2
        with:
          files: d2-armor-solver-offline.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
