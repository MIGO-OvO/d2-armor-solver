[package]
name = "d2-armor-solver-desktop"
version = "3.0.1"
description = "Offline Destiny 2 armor loadout workbench"
authors = ["MIGO-OvO"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
